version: '3.8'

services:
  edualert-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: edualert-service
    restart: always
    expose:
      - "3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - HOST=0.0.0.0
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - JWT_SECRET=${JWT_SECRET}
    env_file:
      - ./server/.env
    volumes:
      - ./logs:/app/logs
      - ./server/data:/app/server/data

  nginx:
    image: nginx:1.27-alpine
    container_name: edualert-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/edualert.docker.conf:/etc/nginx/conf.d/default.conf:ro
      - ./dist:/usr/share/nginx/html:ro
    depends_on:
      - edualert-app
