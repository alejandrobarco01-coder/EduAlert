version: '3.8'

services:
  edualert-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: edualert-service
    restart: always
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      # Cargar variables de entorno adicionales desde un archivo local .env en producción
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - JWT_SECRET=${JWT_SECRET}
    env_file:
      - ./server/.env
    volumes:
      # Persistir logs del servidor fuera del contenedor para auditoría y depuración
      - ./logs:/app/logs
      # En caso de persistencia física de datos JSON en local (server/data)
      - ./server/data:/app/server/data
